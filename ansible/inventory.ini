[pi]
pi5 ansible_host=192.168.1.253 ansible_user=joe

[pi:vars]
ansible_python_interpreter=/usr/bin/python3

# The K3s worker: an Ubuntu VM (Multipass) on the M1 MacBook - see
# docs/node-migration.md. By IP, like the Pi: no dependency on DNS. Its
# ubuntu user takes the Mac's, the Pi's (pi5-ansible) and the desktop's keys.
[m1]
m1-node ansible_host=192.168.1.63 ansible_user=ubuntu

[m1:vars]
ansible_python_interpreter=/usr/bin/python3
