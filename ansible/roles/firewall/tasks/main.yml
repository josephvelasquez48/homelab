---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

# Kept in sync with what's actually running - see docs/kubernetes.md for
# why K3s's own Service traffic (Traefik on :80/:443, i.e. api.home/
# grafana.home/argocd.home) ISN'T listed here: kube-router/kube-proxy's
# iptables chains process before ufw's, so a ufw rule for those ports
# would be a no-op that implies protection it doesn't provide. That's
# enforced at the Kubernetes NetworkPolicy layer instead
# (kubernetes/argocd/traefik-security.yaml).
- name: Allow LAN-scoped services (IPv4)
  community.general.ufw:
    rule: allow
    from_ip: 192.168.1.0/24
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "22", proto: tcp, comment: "SSH - LAN only" }
    - { port: "53", proto: any, comment: "DNS - LAN only" }
    - { port: "3000", proto: tcp, comment: "AdGuard Home UI - LAN only" }
    - { port: "6443", proto: tcp, comment: "K3s API - LAN only" }
    - { port: "8472", proto: udp, comment: "K3s Flannel VXLAN - LAN only" }
    - { port: "10250", proto: tcp, comment: "K3s kubelet - LAN only" }

- name: Allow LAN-scoped services (IPv6)
  community.general.ufw:
    rule: allow
    from_ip: "{{ lan_ipv6_prefix }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "53", proto: any, comment: "DNS - LAN IPv6 only" }
    - { port: "3000", proto: tcp, comment: "AdGuard Home UI - LAN IPv6 only" }
  # Skipped when no IPv6 prefix is configured. See the variable's own
  # comment in defaults/main.yml for why the value is a rotatable
  # ISP-delegated GUA rather than a ULA, and docs/router-migration.md for
  # the tripwire that creates.
  when: lan_ipv6_prefix | length > 0

# Rules ufw is still enforcing for prefixes nobody is on any more.
#
# ufw does not remove a rule just because Ansible stopped asking for it,
# so retiring a prefix from lan_ipv6_prefix leaves the old allow-rules in
# place indefinitely. fd00:f405:95c7:c412::/64 was the previous router's
# self-generated ULA; its replacement hands out no ULA at all, so these
# match nothing (docs/router-migration.md).
#
# A stale allow-rule is worse than no rule: it reads as protection that is
# not being provided, which is the same mistake this role's own comments
# refuse to make for Traefik's ports. Deleting is safe precisely because
# nothing holds an address in that prefix - if something did, the rule
# would be load-bearing and this task would be the wrong fix.
- name: Remove allow-rules for retired IPv6 prefixes
  community.general.ufw:
    rule: allow
    delete: true
    from_ip: "{{ item.0 }}"
    port: "{{ item.1.port }}"
    proto: "{{ item.1.proto }}"
  loop: "{{ retired_ipv6_prefixes | product(retired_ipv6_ports) | list }}"
  when: retired_ipv6_prefixes | length > 0
- name: Enable ufw
  community.general.ufw:
    state: enabled
