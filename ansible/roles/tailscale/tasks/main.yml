---
# Installs and starts tailscaled. Signing the Pi in to the tailnet and
# turning Funnel on are one-time manual steps (they need the account
# owner's browser) - docs/cam.md, "Sharing by link".

- name: Add Tailscale's package signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_apt_suite }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale's package repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: >
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/debian {{ tailscale_apt_suite }} main
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
  # On a first --check the repository above was only pretended, so apt
  # can't see the package yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Run tailscaled in userspace networking mode
  ansible.builtin.lineinfile:
    path: /etc/default/tailscaled
    regexp: '^FLAGS='
    line: 'FLAGS="{{ tailscale_flags }}"'
    create: true
    mode: "0644"
  notify: Restart tailscaled

- name: Start tailscaled, and at boot
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
