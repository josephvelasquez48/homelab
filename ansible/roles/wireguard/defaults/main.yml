---
# wireguard_interface, _port, _network and cam_mac_ip are in
# group_vars/pi.yml: the firewall role's rules use them too.
wireguard_address: 10.8.0.1/24
wireguard_lan_interface: eth0

# What phones put in their config: the home connection's public address.
# A residential IP - it can change, and then every phone needs this
# updated (docs/vpn.md). The router forwards UDP wireguard_port to the Pi.
wireguard_endpoint: "66.215.85.224:{{ wireguard_port }}"

# Split tunnel, and only what the camera needs: the Pi (DNS, and Traefik
# for cam.home) and the Mac (the video, UDP 8189). The firewall role allows
# exactly this much forwarding; widen both together.
wireguard_client_allowed_ips: "192.168.1.253/32, {{ cam_mac_ip }}/32"
wireguard_client_dns: 192.168.1.253
