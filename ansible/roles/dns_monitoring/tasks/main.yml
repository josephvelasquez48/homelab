---
- name: Ensure ~/apps exists
  ansible.builtin.file:
    path: /home/joe/apps
    state: directory
    owner: joe
    group: joe

- name: Clone or update the homelab repo (deploy key must already exist)
  ansible.builtin.git:
    repo: git@github.com:josephvelasquez48/homelab.git
    dest: /home/joe/apps/homelab
    version: main
    accept_hostkey: true
  become: false # runs as joe implicitly via ansible_user, needs joe's own known_hosts/keys

# Starts both containers in docker/dns's compose project: CoreDNS
# (LAN-facing, *.home + forwarding) and AdGuard Home behind it
# (ad/tracker filtering, loopback-only DNS listener). AdGuard's own
# first-run setup wizard (DNS listen port, upstream servers, admin
# account) isn't automated here - see docker/dns/README.md, same
# "manual for now" note that applied to the CoreDNS-only setup this
# replaced.
- name: Start the DNS stack (CoreDNS + AdGuard Home)
  community.docker.docker_compose_v2:
    project_src: /home/joe/apps/homelab/docker/dns
    state: present
  become: false

- name: Start the monitoring stack (node-exporter)
  community.docker.docker_compose_v2:
    project_src: /home/joe/apps/homelab/docker/monitoring
    state: present
  become: false
