---
- name: Provision the Raspberry Pi
  hosts: pi
  become: true
  roles:
    - common # cgroup fix + reboot - must run before docker/k3s
    - docker
    - role: firewall
      tags: [firewall, vpn]
    # The home VPN, for the camera away from home (docs/vpn.md). Run with
    # its ufw rules: ansible-playbook playbooks/site.yml --tags vpn
    - role: wireguard
      tags: [wireguard, vpn]
    - role: k3s
      tags: k3s # run alone: ansible-playbook playbooks/site.yml --tags k3s
    - dns_monitoring
    # github_runner is not here on purpose: see playbooks/github-runner.yml.

# The K3s worker: only its pod DNS upstream (roles/k3s with k3s_role: agent).
# The VM itself and its join were done by hand - docs/node-migration.md.
- name: The K3s worker (m1-node)
  hosts: m1
  become: true
  roles:
    - role: k3s
      tags: k3s
      vars:
        k3s_role: agent
