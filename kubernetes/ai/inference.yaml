# Ollama runs on the desktop for GPU access, as a systemd service inside
# WSL (not a pod, and no longer a Windows-side process) - this
# Service/Endpoints pair (no selector, no ExternalName) points in-cluster
# traffic at it by IP directly, rather than relying on a pod's own upstream
# DNS resolution to work for an external hostname. Standard Kubernetes
# pattern for referencing a service that lives outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: ai
spec:
  ports:
    - port: 11434
      targetPort: 11434
---
# WARNING: this Endpoints object is NOT managed by Argo CD, even though
# it lives in an Argo-CD-synced path. Argo's stock resource.exclusions in
# argocd-cm excludes Endpoints and EndpointSlice (control-plane-managed,
# high-churn, excluded to cut watch events) - so it is skipped silently
# and the `ai` Application still reports Synced/Healthy while the cluster
# disagrees with this file. Found the hard way: a DHCP change moved the
# desktop from .131 to .133, the commit updating this line synced
# "successfully", and the Endpoints kept the old address until it was
# applied by hand. The only visible trace is an ExcludedResourceWarning
# condition on the Application.
#
# After changing the address below, apply it directly - a sync will not:
#   kubectl apply -f kubernetes/ai/inference.yaml
#
# In normal operation you should not need to: the CronJob in
# inference-endpoint-sync.yaml copies the desktop node's InternalIP here
# every 5 minutes, which is what actually keeps this correct across a DHCP
# lease change. The address below is the starting value, not the source of
# truth.
apiVersion: v1
kind: Endpoints
metadata:
  name: inference
  namespace: ai
subsets:
  - addresses:
      - ip: 192.168.1.133
    ports:
      - port: 11434
