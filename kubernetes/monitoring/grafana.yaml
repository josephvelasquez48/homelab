# The grafana-admin Secret this Deployment references lives in
# kubernetes/secrets/grafana-admin.enc.yaml (SOPS-encrypted, not synced by
# Argo CD - applied separately). See docs/secrets.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Homelab
        type: file
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: monitoring
data:
  homelab-overview.json: |
    {
      "title": "Homelab Overview",
      "uid": "homelab-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Targets Up",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "targets": [
            { "expr": "up", "legendFormat": "{{job}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Pi CPU Usage %",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        },
        {
          "id": 3,
          "title": "Pi Memory Usage %",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "Memory %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        },
        {
          "id": 4,
          "title": "Pi Disk Usage % (/)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            { "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"}) * 100)", "legendFormat": "Disk %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] }
        },
        {
          "id": 5,
          "title": "API Request Rate (all pods)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            { "expr": "sum(rate(http_requests_total[5m])) by (handler)", "legendFormat": "{{handler}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 6,
          "title": "API p95 Latency",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 22 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, handler))", "legendFormat": "{{handler}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 7,
          "title": "Pi CPU Temperature",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 30 },
          "targets": [
            { "expr": "node_hwmon_temp_celsius{job=\"node-pi\",chip=\"thermal_thermal_zone0\",sensor=\"temp0\"}", "legendFormat": "SoC Temp", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 60 }, { "color": "red", "value": 80 }] } }, "overrides": [] }
        },
        {
          "id": 8,
          "title": "Pi Load Average",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 30 },
          "targets": [
            { "expr": "node_load1{job=\"node-pi\"}", "legendFormat": "1m", "refId": "A" },
            { "expr": "node_load5{job=\"node-pi\"}", "legendFormat": "5m", "refId": "B" },
            { "expr": "node_load15{job=\"node-pi\"}", "legendFormat": "15m", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 9,
          "title": "Pi Network Throughput",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 38 },
          "targets": [
            { "expr": "rate(node_network_receive_bytes_total{job=\"node-pi\",device!=\"lo\"}[5m])", "legendFormat": "RX {{device}}", "refId": "A" },
            { "expr": "rate(node_network_transmit_bytes_total{job=\"node-pi\",device!=\"lo\"}[5m])", "legendFormat": "TX {{device}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] }
        },
        {
          "id": 10,
          "title": "Pi Disk I/O Throughput",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 38 },
          "targets": [
            { "expr": "rate(node_disk_read_bytes_total{job=\"node-pi\"}[5m])", "legendFormat": "Read {{device}}", "refId": "A" },
            { "expr": "rate(node_disk_written_bytes_total{job=\"node-pi\"}[5m])", "legendFormat": "Write {{device}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] }
        },
        {
          "id": 11,
          "title": "OOM Kills (since boot)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 46 },
          "targets": [
            { "expr": "node_vmstat_oom_kill{job=\"node-pi\"}", "legendFormat": "OOM Kills", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] }
        },
        {
          "id": 12,
          "title": "Desktop Load Average",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 52 },
          "targets": [
            { "expr": "node_load1{pod=~\"node-exporter-desktop.*\"}", "legendFormat": "1m", "refId": "A" },
            { "expr": "node_load5{pod=~\"node-exporter-desktop.*\"}", "legendFormat": "5m", "refId": "B" },
            { "expr": "node_load15{pod=~\"node-exporter-desktop.*\"}", "legendFormat": "15m", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 13,
          "title": "Desktop Network Throughput",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 52 },
          "targets": [
            { "expr": "rate(node_network_receive_bytes_total{pod=~\"node-exporter-desktop.*\",device=~\"eth[0-9]+\"}[5m])", "legendFormat": "RX {{device}}", "refId": "A" },
            { "expr": "rate(node_network_transmit_bytes_total{pod=~\"node-exporter-desktop.*\",device=~\"eth[0-9]+\"}[5m])", "legendFormat": "TX {{device}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] }
        },
        {
          "id": 14,
          "title": "Desktop Disk I/O Throughput",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 60 },
          "targets": [
            { "expr": "rate(node_disk_read_bytes_total{pod=~\"node-exporter-desktop.*\"}[5m])", "legendFormat": "Read {{device}}", "refId": "A" },
            { "expr": "rate(node_disk_written_bytes_total{pod=~\"node-exporter-desktop.*\"}[5m])", "legendFormat": "Write {{device}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] }
        },
        {
          "id": 15,
          "title": "Desktop OOM Kills (since boot)",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 68 },
          "targets": [
            { "expr": "node_vmstat_oom_kill{pod=~\"node-exporter-desktop.*\"}", "legendFormat": "OOM Kills", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }, "overrides": [] }
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      nodeSelector:
        kubernetes.io/hostname: joe
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1
          envFrom:
            - secretRef: { name: grafana-admin }
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/json
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: datasource
          configMap: { name: grafana-datasource }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboard-json
          configMap: { name: grafana-dashboard-json }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
spec:
  rules:
    - host: grafana.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: grafana, port: { number: 3000 } }
