apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: backend
data:
  OLLAMA_URL: "http://inference.ai.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen2.5-coder:7b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  RATE_LIMIT_PER_MINUTE: "60"
# The api-secrets Secret referenced below lives in
# kubernetes/secrets/api-secrets.enc.yaml (SOPS-encrypted, not synced by
# Argo CD - applied separately). See docs/secrets.md.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: backend
  annotations:
    # Jobs are immutable once created - Argo CD can't apply an image tag
    # change to an already-completed Job, which left this permanently
    # OutOfSync while every other resource in this file synced fine.
    # PreSync + BeforeHookCreation makes Argo CD delete and recreate it
    # fresh on every sync instead of trying to reconcile it in place -
    # the correct pattern for one-off Jobs (migrations) under GitOps.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/josephvelasquez48/homelab-api:c11200330392
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/josephvelasquez48/homelab-api:c11200330392
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: backend
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: backend
spec:
  rules:
    - host: api.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
    - host: ai.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
