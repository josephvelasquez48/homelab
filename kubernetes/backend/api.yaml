apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: backend
data:
  OLLAMA_URL: "http://inference.ai.svc.cluster.local:11434"
  OLLAMA_MODEL: "qwen2.5-coder:7b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  # Full-text search over the local Wikipedia archive, for conversations
  # that ask for it. Listed here even though the code defaults to the same
  # value, so that reading this file tells you what the api talks to.
  ZIMSEARCH_URL: "http://zimsearch.kiwix.svc.cluster.local:8081"
  RATE_LIMIT_PER_MINUTE: "60"
# The api-secrets Secret referenced below lives in
# kubernetes/secrets/api-secrets.enc.yaml (SOPS-encrypted, not synced by
# Argo CD - applied separately). See docs/secrets.md.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: backend
  annotations:
    # Jobs are immutable once created - Argo CD can't apply an image tag
    # change to an already-completed Job, which left this permanently
    # OutOfSync while every other resource in this file synced fine.
    # PreSync + BeforeHookCreation makes Argo CD delete and recreate it
    # fresh on every sync instead of trying to reconcile it in place -
    # the correct pattern for one-off Jobs (migrations) under GitOps.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      # Pinned to the Pi because this Job's placement is load-bearing and
      # was previously unconstrained. It has to reach Postgres, and
      # Postgres is itself pinned here (kubernetes/data/postgres.yaml)
      # because its local-path PV lives on this node's disk - so the
      # migration always has a reason to run alongside it, not merely a
      # preference.
      #
      # Left unpinned, the scheduler was free to place it on the desktop,
      # where a cross-node networking failure made every attempt fail DNS
      # resolution for postgres.data.svc - three times, exhausting
      # backoffLimit and blocking the whole PreSync hook, which left
      # backend OutOfSync while the running pods stayed healthy. Pinning
      # does not fix that networking fault; it stops a database migration
      # depending on the scheduler's choice of node to reach the database.
      nodeSelector:
        kubernetes.io/hostname: joe
      containers:
        - name: migrate
          image: ghcr.io/josephvelasquez48/homelab-api:77c6077501f2
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    # Remove an old pod before starting its replacement, not after. With
    # one api pod allowed per node and two nodes, a surged third pod has
    # nowhere to go: maxSurge 1 with maxUnavailable 0 deadlocked the first
    # rollout after the anti-affinity below went in. The new pod waited for
    # a node with no api pod, and the old pod on that node waited for the
    # new one to be ready - old pods match the anti-affinity too.
    #
    # The cost is one replica serving while each replacement starts. Never
    # zero: maxUnavailable 1 of 2 keeps one running. When m1-node is away
    # and only one pod runs, a rollout cannot remove it, so it stalls with
    # that pod still serving.
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Both replicas sat on the Pi, because nothing moves a running pod
      # and both were scheduled before m1-node existed. Two copies of the
      # api on one machine are two copies of the same outage.
      #
      # A soft topologySpreadConstraint was tried first and made it worse:
      # during the rollout the scheduler put BOTH replicas on m1-node,
      # because a preference competes with the scheduler's bias toward the
      # emptier node and the Pi was at 47% memory against 9%. That left the
      # whole api on a laptop VM that disappears on every Mac restart.
      #
      # Required rather than preferred, so it cannot lose that argument.
      # The cost is explicit: while m1-node is away - after every restart,
      # until someone types the FileVault password - the second replica has
      # nowhere to go and stays Pending, so the api runs as one replica on
      # the Pi.
      # A rolling update in that state stalls; see the strategy above.
      #
      # This is not high availability either way. Postgres, Redis, Traefik
      # and the control plane are all on the Pi, so losing the Pi takes the
      # lab down regardless of where the api runs.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app: api }
      containers:
        - name: api
          image: ghcr.io/josephvelasquez48/homelab-api:77c6077501f2
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # /ready, not /health: readiness additionally checks Ollama, so
          # a replica that cannot reach it steps out of the Service
          # instead of failing every /v1/chat and RAG request routed to
          # it. This caught a real case - Ollama as a Windows-side
          # process was unreachable from pods on the desktop node itself
          # - which is fixed now that it runs inside WSL, but "Ollama is
          # down" is still a reason for a replica to stop serving.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness stays on /health, which deliberately does NOT check
          # Ollama. Restarting a pod cannot make an unreachable Ollama
          # reachable, so pointing liveness at /ready would crash-loop
          # every replica for the duration of an Ollama outage.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: backend
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - secretName: homelab-tls
      hosts:
        - api.home
        - ai.home
  rules:
    - host: api.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
    - host: ai.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8000 } }
