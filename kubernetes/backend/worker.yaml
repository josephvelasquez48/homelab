apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/josephvelasquez48/homelab-api:c11200330392
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
