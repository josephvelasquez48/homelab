# Argo CD itself is installed via its official upstream manifest
# (see docs/argocd.md) rather than a manifest in this repo - it's the
# tool that manages everything else declaratively, so it doesn't make
# sense to have it manage its own installation on day one. This Ingress
# is the one piece of local config for it: exposing the UI at argocd.home
# through Traefik. TLS terminates at Traefik; argocd-server remains
# --insecure for the internal HTTP hop. Client connections use HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - secretName: homelab-tls
      hosts:
        - argocd.home
  rules:
    - host: argocd.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: argocd-server, port: { number: 80 } }
