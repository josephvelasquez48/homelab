# Not part of the app-of-apps (deliberately not Argo-CD-managed) - this
# configures K3s's own bundled Traefik, applied once directly like Argo CD
# itself. See docs/kubernetes.md for the finding this fixes: ufw's
# LAN-only rules never applied to anything K3s exposes, because
# kube-router/kube-proxy's iptables chains (KUBE-ROUTER-INPUT,
# KUBE-NODEPORTS, etc.) process before ufw's in the INPUT chain - Traefik
# (and everything behind it: api.home, grafana.home, argocd.home) was
# reachable from the whole LAN regardless of the ufw rules that implied
# otherwise.
#
# HelmChartConfig is K3s's supported way to override its bundled Traefik
# HelmChart - a raw `kubectl patch` on the Service would get reverted by
# K3s's own Helm controller reconciliation.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--entrypoints.web.http.redirections.entrypoint.to=:443"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    service:
      spec:
        externalTrafficPolicy: Local
---
# externalTrafficPolicy: Local preserves the real client source IP
# (instead of kube-proxy SNAT'ing it to a cluster-internal address, which
# would make source-IP-based filtering meaningless) - this NetworkPolicy
# is what actually restricts who can reach Traefik, now that the source
# IP surviving to the pod makes it possible at all. Enforced by
# kube-router, which is already active in this cluster (confirmed via the
# KUBE-NWPLCY-* iptables chains before this fix was written).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-lan-only
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock: { cidr: 192.168.1.0/24 }
        # The IPv6 half is an ISP-delegated GUA prefix, not the ULA this
        # line once carried. The previous router self-generated
        # fd00:f405:95c7:c412::/64, stable by construction; its
        # replacement offers no ULA, so the LAN runs on whatever Spectrum
        # delegates (docs/router-migration.md).
        #
        # So this line can go stale. If the delegated prefix rotates, LAN
        # IPv6 clients stop matching and lose every ingress hostname while
        # IPv4 keeps working - the symptom is "it loads on my phone but
        # not my laptop", not a clean outage. This file is applied by
        # hand, so repairing it needs a kubectl apply, not just a commit.
        #
        # Inert as it stands: docker/dns/coredns/home.hosts serves only A
        # records, so no .home name resolves to an IPv6 address and nothing
        # reaches Traefik over IPv6 to be matched. It is here so that adding
        # AAAA records later is a one-line DNS change rather than a silent
        # "works on IPv4, times out on IPv6" hunt through this policy.
        - ipBlock: { cidr: 2600:6c51:4500:20e2::/64 }
    # Narrow, separate exception for in-cluster Prometheus scraping of
    # Traefik's own metrics endpoint (see docs/kubernetes.md - discovered
    # via Grafana's "Targets Up" panel showing this scrape as down).
    # Scoped to just Prometheus's pod, in the monitoring namespace, on
    # just the metrics port - the LAN-only restriction above is
    # unchanged for every web-facing port (80/443/8080/8443).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9100
