apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: dashboard
---
# Read-only, cluster-scoped: the display only ever GETs node/pod
# state, never writes anything to the K8s API. Pod metrics (live CPU and
# memory from metrics-server) size and speed the display's fish.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
# Namespaced to argocd, not cluster-wide - the dashboard only needs to
# read Application status, not every resource Argo CD itself can touch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-read-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-read-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-read-applications
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
# The debug pages behind the display (tap a box or a fish): pod logs and
# events. A ClusterRole only so the rules are written once - it's bound
# per namespace below, so the dashboard can read logs only in the
# namespaces on the map. Not cam: its logs carry viewers' addresses and
# invite links, and the dashboard has no login. app/component.py also masks
# anything credential-shaped in what it shows.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-debug
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: chat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: kiwix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-debug
  namespace: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-debug
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
# Serves the Pi's always-on display (dashboard.home/display) and nothing
# else: the status page, its login and the Free the GPU button were
# removed - Ollama unloads idle models by itself (docs/gaming-mode.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      serviceAccountName: dashboard
      # Pinned to the Pi so the dashboard stays reachable even while the
      # desktop is cordoned/drained/off the cluster entirely - the whole
      # point of gaming mode is to remove the desktop, and a dashboard
      # that could itself land there would be unavailable exactly when
      # someone might want to check on it or bring the desktop back.
      nodeSelector:
        kubernetes.io/hostname: joe
      containers:
        - name: dashboard
          image: ghcr.io/josephvelasquez48/homelab-dashboard:504bb19cd3eb
          # Weather on the Pi's display (Open-Meteo, no key): ZIP 92505,
          # Riverside CA. Unset hides it.
          env:
            - { name: WEATHER_LAT, value: "33.92" }
            - { name: WEATHER_LON, value: "-117.49" }
          ports:
            - containerPort: 8000
          # The CPU limit is for bursts, not the average (~80m): every 5 s
          # /api/display gathers about a dozen sources at once. At 200m it
          # was throttled in about half of all 100 ms periods (5.5 s lost
          # per 20 s) and each poll took 0.7-1.2 s, with the Pi's cores
          # mostly idle. The request stays at 50m.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 1000m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: dashboard
spec:
  selector: { app: dashboard }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: dashboard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - secretName: homelab-tls
      hosts:
        - dashboard.home
  rules:
    - host: dashboard.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: dashboard, port: { number: 8000 } }
