apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: dashboard
---
# Read-only, cluster-scoped: the status page only ever GETs node/pod
# state, never writes anything to the K8s API itself. The only writes
# this app causes go through SSH to the desktop (see gaming-mode/), not
# through the K8s API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
# Namespaced to argocd, not cluster-wide - the dashboard only needs to
# read Application status, not every resource Argo CD itself can touch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-read-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-read-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-read-applications
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: dashboard
---
# No SSH key or known_hosts mount any more. The dashboard used to reach
# the desktop over SSH to cordon and drain a K3s node; that node is gone
# (docs/node-migration.md) and freeing the GPU is now an HTTP call to the
# inference Service, so the private key, the host key, and remote
# PowerShell execution all left with it. See apps/dashboard/app/gpu.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      serviceAccountName: dashboard
      # Pinned to the Pi so the dashboard stays reachable even while the
      # desktop is cordoned/drained/off the cluster entirely - the whole
      # point of gaming mode is to remove the desktop, and a dashboard
      # that could itself land there would be unavailable exactly when
      # someone might want to check on it or bring the desktop back.
      nodeSelector:
        kubernetes.io/hostname: joe
      containers:
        - name: dashboard
          image: ghcr.io/josephvelasquez48/homelab-dashboard:69f979a559a7
          # DASHBOARD_PASSWORD + SESSION_SECRET for the session auth on
          # /api/gpu/release (see apps/dashboard/app/auth.py).
          #
          # optional: true is deliberate. A required secretRef would leave
          # the pod in CreateContainerConfigError until the Secret is
          # applied - i.e. an unapplied Secret would take the whole status
          # page down, including the part that tells you the cluster is
          # unhealthy. Optional instead means the pod starts and the app
          # fails closed on its own: with no password configured nobody can
          # log in, so /api/gpu/release is unreachable rather than
          # open. The page says so explicitly via /api/session.
          envFrom:
            - secretRef: { name: dashboard-auth, optional: true }
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: dashboard
spec:
  selector: { app: dashboard }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: dashboard
spec:
  rules:
    - host: dashboard.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: dashboard, port: { number: 8000 } }
