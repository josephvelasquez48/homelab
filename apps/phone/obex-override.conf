# Installed to ~/.config/systemd/user/obex.service.d/phone-bridge.conf by
# install.sh. The phone bridge only uses obexd as a *client* (PBAP for
# contacts, MAP for texts), so its server plugins stay unloaded and can
# never be registered - normally they aren't anyway (an obexd start-order
# race, see app/mns.py), but a bluetoothd restart after obexd registers
# them all, including Object Push and File Transfer, which would let a
# paired device push files to or browse ~/.cache/obexd on the Pi.
#
# mns stays: obexd exits with "obex_server_init failed" if every server
# plugin is excluded, and MNS only ever receives notifications. If it
# does get registered, it sits beside the phone bridge's own MNS
# (app/mns.py) and the phone can use either.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd -P pcsuite,opp,ftp,irmc,mas,syncevolution
