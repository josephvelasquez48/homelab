# Installed to ~/.config/systemd/user/obex.service.d/phone-bridge.conf by
# install.sh. The phone bridge only uses obexd as a *client* (PBAP, for
# contacts), so its server plugins stay unloaded and can never be
# registered. Normally they aren't anyway: obexd's Bluetooth plugin
# registers server profiles when it sees org.bluez appear, which happens
# during plugin init before the server list exists. But a bluetoothd
# restart after obexd registers them all - seen on this Pi - including
# Object Push and File Transfer, which would let a paired device push
# files to or browse ~/.cache/obexd.
#
# mns stays: obexd exits with "obex_server_init failed" if every server
# plugin is excluded, and MNS only ever receives notifications.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd -P pcsuite,opp,ftp,irmc,mas,syncevolution
