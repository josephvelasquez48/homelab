# Installed to ~/.config/systemd/user/obex.service.d/phone-bridge.conf by
# install.sh. The phone bridge only uses obexd as a *client* (PBAP for
# contacts, MAP for texts). Its server plugins stay unloaded so they can
# never be registered - normally they aren't anyway (an obexd start-order
# race, see app/mns.py), but a bluetoothd restart after obexd registers
# them all, including Object Push and File Transfer, which would let a
# paired device push files to or browse ~/.cache/obexd on the Pi. mns is
# excluded too: the phone bridge runs its own MNS (app/mns.py), and two
# registrations of the same service would leave the phone to pick one.
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd -P pcsuite,opp,ftp,irmc,mas,mns,syncevolution
