# ~/.config/pipewire/pipewire.conf.d/, installed by apps/phone/install.sh.
# Run PipeWire's audio thread at realtime priority through rtkit, so call
# audio keeps its timing when the Pi is busy (docs/phone.md). The default
# asks xdg-desktop-portal first, which reports no realtime allowance for an
# unsandboxed PipeWire and never reaches rtkit - so skip the portal. 20 is
# the most rtkit hands out.
module.rt.args = {
    rtportal.enabled = false
    rt.prio          = 20
    nice.level       = -11
}
