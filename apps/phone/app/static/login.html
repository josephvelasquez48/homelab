<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Add to Home Screen on the iPhone: opens full screen, like an app. -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Homelab">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <main>
    <h1>Phone</h1>
    <form class="card" method="post" action="/login">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
      <div class="error" id="error"></div>
      <div class="row"><button class="primary" type="submit">Log in</button></div>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("failed")) {
      document.getElementById("error").textContent = "Wrong password.";
    }
  </script>
</body>
</html>
