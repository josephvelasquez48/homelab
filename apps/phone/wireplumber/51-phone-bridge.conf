# Installed to ~/.config/wireplumber/wireplumber.conf.d/ on the Pi by
# apps/phone/install.sh. Each setting here comes from a failure seen on a
# real call - see docs/phone.md.
monitor.bluez.properties = {
  # The Pi 5's onboard Bluetooth sits behind a UART, and wideband (mSBC)
  # SCO frames arrive split across HCI packets: the kernel logs
  # "Unexpected continuation frame" and PipeWire "spa.bluez5.source.sco:
  # decode failed: -3" for every frame, so the call decoded to silence.
  # Narrowband CVSD has no frame sync to lose - 8 kHz phone-line quality
  # instead of 16 kHz "HD voice".
  bluez5.enable-msbc = false

  # The phone pushes its call-volume setting to the hands-free unit, and
  # WirePlumber applied it to the incoming stream: 0.019 (-34 dB) on the
  # first live call, which made a working call measure as silence. Volume
  # is the browser's job here, so ignore the phone's.
  bluez5.enable-hw-volume = false
}

monitor.bluez.rules = [
  {
    # Left to the default policy, WirePlumber linked the call's incoming
    # stream to the Pi's only sink (Dummy Output) and that sink's monitor
    # back into the outgoing stream - a loop that echoed the caller's own
    # voice back to them. The phone bridge links these streams itself.
    matches = [
      { api.bluez5.profile = "headset-audio-gateway" }
    ]
    actions = {
      update-props = {
        node.autoconnect = false
      }
    }
  }
]
