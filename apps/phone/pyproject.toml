[project]
name = "homelab-phone"
version = "0.1.0"
description = "Take iPhone calls on the desktop: the Pi is the phone's Bluetooth hands-free unit, the browser is its mic and speaker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Session-bus client for PipeWire's org.pipewire.Telephony service.
    "dbus-fast>=2.24",
    # Signs the session cookie for starlette's SessionMiddleware.
    "itsdangerous>=2.2",
    # Parses the login form (FastAPI's Form()).
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
