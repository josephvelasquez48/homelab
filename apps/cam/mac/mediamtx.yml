# MediaMTX on the Mac: the C922 webcam as a WebRTC stream.
#
# A template - install.py fills in the viewer password and its own folder,
# and writes the result to ~/.config/homelab-cam/mediamtx.yml. Anything not set here is MediaMTX's
# default; see the commented default config in
# /opt/homebrew/etc/mediamtx/mediamtx.yml for what each key does.
#
# Browsers never talk to this directly. The cam app in the cluster does the
# WebRTC signaling (WHEP) on their behalf with the viewer login below, and
# only the media then flows straight between browser and Mac, over UDP 8189.

logLevel: info

authMethod: internal
authInternalUsers:
  # ffmpeg on this Mac publishes the camera. Nothing else can publish.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: cam
      - action: api
      - action: metrics
  # The cam app. Pod traffic leaves the cluster from a node's address, so the
  # login only works from the two nodes (and from this Mac, for testing over
  # an SSH tunnel).
  - user: cam-app
    pass: "{{VIEWER_PASSWORD}}"
    ips: ["192.168.1.253", "192.168.1.63", "127.0.0.1", "::1"]
    permissions:
      - action: read
        path: cam

# Localhost only: the installer's health check, and later Prometheus via
# whatever scrapes it.
api: true
apiAddress: 127.0.0.1:9997

# ffmpeg's way in. TCP only, so no RTP/RTCP UDP ports are opened.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# en0 is the LAN. Without this MediaMTX also offers bridge100, the Multipass
# network m1-node's VM sits on, which no phone can reach.
webrtcIPsFromInterfacesList: [en0]
# Viewers on the internet (the public link, docs/cam.md) can't reach en0's
# address. STUN tells MediaMTX the home connection's public address, which
# it offers too; the router forwards UDP 8189 to this Mac. Asked fresh each
# time, so a changed public IP needs no edit here.
webrtcICEServers2:
  - url: stun:stun.cloudflare.com:3478

paths:
  cam:
    # On demand: the camera (and its light) is on only while someone is
    # watching, and goes off 15 s after the last viewer leaves.
    #
    # cam-capture (capture.swift) opens the camera, because ffmpeg can't put
    # the C922 in its 30 fps mode, and pipes raw frames to the ffmpeg after
    # `--`. ffmpeg stamps them by arrival and evens them out to a steady
    # 30 fps (-fps_mode cfr -r 30): without that the encoder's timestamps
    # came out in the wrong units and the stream claimed 0.01 s per 14 s of
    # video. h264_videotoolbox is the Mac's hardware encoder; baseline with
    # no B-frames is what every browser's WebRTC decodes, and a keyframe a
    # second keeps joining quick.
    runOnDemand: >-
      {{CONFIG_DIR}}/cam-capture "C922 Pro Stream Webcam" 1920 1080 30 --
      /opt/homebrew/bin/ffmpeg -hide_banner -loglevel warning
      -f rawvideo -pix_fmt nv12 -video_size 1920x1080 -use_wallclock_as_timestamps 1 -i -
      -fps_mode cfr -r 30
      -c:v h264_videotoolbox -realtime 1 -profile:v baseline -bf 0 -g 30
      -b:v 4M -maxrate 5M -bufsize 4M
      -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 15s
