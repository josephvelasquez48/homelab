<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6efdc" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-title" content="Mustard Cam">
  <title>Sign in · Mustard Cam</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/login.js"></script>
</head>
<body>
  <main class="narrow">
    <div class="brand"><span class="brand-name"><b>Mustard</b> Cam</span></div>
    <p class="tagline">A live look at Mustard the tortoise.</p>
    <div class="hero" aria-hidden="true">
      <div class="mustard" data-pose="hello"></div>
      <div class="dandelion"></div>
    </div>
    <div class="card">
      <h1>Sign in</h1>
      <p class="lede">With the passkey you made from your invite - Face ID, your fingerprint, or your device PIN.</p>
      <button id="signin" class="btn primary block" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4M18 5l2 2M15 8l2 2"/></svg>
        Sign in with passkey
      </button>
      <p id="msg" class="msg" hidden></p>
      <p class="hint">No account, or a new phone without your passkey? Ask Mustard's keeper for a link.</p>
    </div>
  </main>
</body>
</html>
