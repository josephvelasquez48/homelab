<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <title>Account · Camera</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/account.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <span class="brand-name">Camera</span>
    </a>
    <nav></nav>
  </header>

  <main class="page">
    <section class="card">
      <h2>Your passkeys</h2>
      <p class="lede">How you sign in. A passkey that says <em>synced</em> follows you to your other devices through iCloud Keychain or Google Password Manager. For a device that doesn't share them - an Android phone alongside an iPhone, say - add one from that device.</p>
      <table>
        <thead><tr><th>Device</th><th>Added</th><th>Last used</th><th></th></tr></thead>
        <tbody id="passkeys"></tbody>
      </table>
      <button id="add" class="btn block" type="button">Add a passkey on this device</button>
      <p id="msg" class="msg" hidden></p>
    </section>
  </main>
</body>
</html>
