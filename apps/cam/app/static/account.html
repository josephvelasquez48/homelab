<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6efdc" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-title" content="Mustard Cam">
  <title>Account · Mustard Cam</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/account.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img src="/static/mustard-mark.svg" alt="">
      <span class="brand-name"><b>Mustard</b> Cam</span>
    </a>
    <nav></nav>
  </header>

  <main class="page">
    <section class="card">
      <h2>Your passkeys</h2>
      <p class="lede">How you sign in. A passkey that says <em>synced</em> follows you to your other devices through iCloud Keychain or Google Password Manager. For a device that doesn't share them - an Android phone alongside an iPhone, say - add one from that device.</p>
      <table>
        <thead><tr><th>Device</th><th>Added</th><th>Last used</th><th></th></tr></thead>
        <tbody id="passkeys"></tbody>
      </table>
      <button id="add" class="btn block" type="button">Add a passkey on this device</button>
      <p id="msg" class="msg" hidden></p>
    </section>
  </main>
</body>
</html>
