[project]
name = "homelab-api"
version = "0.1.0"
description = "Homelab platform backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "tenacity>=9.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
