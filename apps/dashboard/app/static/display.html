<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab display</title>
<style>
  :root {
    --bg: #0b0b0b; --panel: #141413; --text: #F1EFE8; --muted: #888780; --faint: #5F5E5A;
    --ok: #97C459; --warn: #EF9F27; --bad: #E24B4A;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: none;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #screen { position: fixed; inset: 0; }
  .view { position: absolute; inset: 0; transition: opacity .6s; }
  .view.hidden { opacity: 0; pointer-events: none; }
  svg, canvas { width: 100%; height: 100%; display: block; }
  #arch-dots { position: absolute; inset: 0; pointer-events: none; } /* the map's traffic dots, over the SVG */
  .bar { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 22px;
    padding: 0 22px; background: rgba(11, 11, 11, .72); z-index: 3; pointer-events: none; font-size: 17px; color: #B4B2A9; }
  #top { top: 0; height: 56px; }
  #bottom { bottom: 0; height: 56px; font-size: 16px; }
  #clock { font-size: 28px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  #title { color: var(--text); font-weight: 600; position: absolute; left: 50%; transform: translateX(-50%); }
  .pill { padding: 3px 12px; border-radius: 999px; font-size: 15px; }
  .pill.ok { background: #173404; color: #C0DD97; }
  .pill.warn { background: #412402; color: #FAC775; }
  .pill.bad { background: #501313; color: #F7C1C1; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  #ticker { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .4s; }
  #pager { display: flex; gap: 7px; }
  #pager span { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  #pager span.on { background: var(--text); }
  #offline { position: absolute; top: 116px; right: 22px; z-index: 4; display: none; } /* under the stats row */
  html.mouse, html.mouse body { cursor: auto; } /* a real mouse is moving: see the script below */
  /* Big enough for a finger: ~44 px tall in the 56 px bar. */
  #to-desktop, #to-call, #to-bt { pointer-events: auto; background: #2C2C2A; color: #D3D1C7; border: 0; border-radius: 999px;
    font: inherit; font-size: 18px; font-weight: 600; padding: 11px 30px; }
  #to-call { background: #D4537E; color: #fff; margin-right: 4px; }
  #to-call[hidden], #to-bt[hidden] { display: none; }
  #to-bt { padding: 11px 22px; margin-right: 4px; }
  #to-bt.off { background: transparent; color: #888780; box-shadow: inset 0 0 0 2px #444441; }
  #confirm { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55); }
  #confirm[hidden] { display: none; }
  #confirm .box { background: #F1EFE8; color: #2C2C2A; border-radius: 12px; padding: 22px 26px; max-width: 460px; }
  #confirm b { font-size: 20px; }
  #confirm p { margin: 8px 0 18px; font-size: 16px; line-height: 1.45; color: #444441; }
  #confirm button { font: inherit; font-size: 17px; border: 0; border-radius: 999px; padding: 10px 22px; margin-right: 10px; }
  #confirm-go { background: #185FA5; color: #fff; }
  #confirm-cancel { background: #D3D1C7; color: #2C2C2A; }
</style>
</head>
<body>
<div id="screen">
  <div class="view" id="arch-view"><svg id="arch" viewBox="0 0 1280 720" aria-label="Homelab architecture with live traffic"></svg><canvas id="arch-dots" aria-hidden="true"></canvas></div>
  <div class="view hidden" id="tank-view"><canvas id="tank" aria-label="Cluster aquarium: one fish per pod"></canvas></div>

  <div class="bar" id="top">
    <span id="clock"></span>
    <span id="date"></span>
    <span id="weather"></span>
    <span id="title">Homelab</span>
    <span style="flex: 1"></span>
    <span class="pill" id="health"></span>
    <span id="phone"></span>
  </div>
  <div class="bar" id="bottom">
    <span class="dot" id="ticker-dot"></span>
    <span id="ticker"></span>
    <button id="to-call" hidden>Call</button>
    <button id="to-bt" hidden></button>
    <button id="to-desktop">Desktop</button>
    <span id="pager"><span class="on"></span><span></span></span>
  </div>
  <span class="pill bad" id="offline">No data - dashboard unreachable</span>
  <div id="confirm" hidden>
    <div class="box">
      <b id="confirm-title"></b>
      <p id="confirm-text"></p>
      <button id="confirm-go"></button><button id="confirm-cancel">Cancel</button>
    </div>
  </div>
</div>
<script src="/static/tank.js"></script>
<script src="/static/display.js"></script>
<script>
// The screen is a touchscreen, so the pointer stays hidden - except while a
// real mouse (Bluetooth) is being moved; it hides again after 3 s still.
// Touches don't count: their pointerType is "touch".
addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  document.documentElement.classList.add("mouse");
  clearTimeout(window.mouseIdle);
  window.mouseIdle = setTimeout(() => document.documentElement.classList.remove("mouse"), 3000);
});
</script>
</body>
</html>
