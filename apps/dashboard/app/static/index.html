<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homelab Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #8b949e; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 1rem; margin: 0 0 12px; color: #c9d1d9; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #21262d; font-size: 0.9rem; }
  .row:last-child { border-bottom: none; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
  .ok { background: #3fb950; }
  .bad { background: #f85149; }
  .warn { background: #d29922; }
  .muted { color: #8b949e; font-size: 0.85rem; }
  button { background: #238636; color: white; border: none; border-radius: 6px; padding: 10px 18px; font-size: 0.95rem; cursor: pointer; margin-right: 8px; }
  button.off { background: #6e40c9; }
  button:disabled { background: #30363d; cursor: not-allowed; }
  #gaming-output { white-space: pre-wrap; background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-top: 12px; font-family: ui-monospace, monospace; font-size: 0.8rem; max-height: 300px; overflow-y: auto; display: none; }
  #gaming-status { margin-bottom: 12px; font-size: 0.9rem; }
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .stat-tile { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 0.8rem; color: #8b949e; }
  .stat-num { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-sub { font-size: 0.75rem; color: #8b949e; }
  .bar-track { background: #21262d; border-radius: 4px; height: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Homelab Dashboard</h1>
  <div class="sub">Pi 5 + desktop K3s cluster — refreshes every 10s</div>

  <div class="grid">
    <div class="card">
      <h2>Nodes</h2>
      <div id="nodes"></div>
    </div>
    <div class="card">
      <h2>Argo CD Applications</h2>
      <div id="argo-apps"></div>
    </div>
    <div class="card">
      <h2>API</h2>
      <div id="api-health"></div>
    </div>
    <div class="card">
      <h2>Pods</h2>
      <div id="pods" style="max-height: 220px; overflow-y: auto;"></div>
    </div>
    <div class="card">
      <h2>Pi metrics</h2>
      <div id="pi-metrics"></div>
    </div>
  </div>

  <div class="card">
    <h2>Gaming mode</h2>
    <div id="gaming-status">Loading...</div>
    <button id="btn-on" onclick="runGaming('on')">Start gaming mode</button>
    <button id="btn-off" class="off" onclick="runGaming('off')">End gaming mode</button>
    <div id="gaming-output"></div>
  </div>

<script>
function dot(cls) { return `<span class="dot ${cls}"></span>`; }

function fmtBytesPerSec(v) {
  if (v === null || v === undefined) return 'n/a';
  const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
  let i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(1)} ${units[i]}`;
}

function fmtNum(v, digits = 1) {
  return (v === null || v === undefined) ? 'n/a' : v.toFixed(digits);
}

function severityColor(v, warn, bad) {
  return v == null ? '#8b949e' : (v >= bad ? '#f85149' : (v >= warn ? '#d29922' : '#3fb950'));
}

function bar(pct, color) {
  const clamped = Math.max(0, Math.min(100, pct));
  return `<div class="bar-track"><div class="bar-fill" style="width:${clamped}%;background:${color}"></div></div>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();

    document.getElementById('nodes').innerHTML = data.nodes.map(n => `
      <div class="row">
        <span>${dot(n.ready ? 'ok' : 'bad')}${n.name}</span>
        <span class="muted">${n.ready ? 'Ready' : 'NotReady'}${n.schedulable ? '' : ', cordoned'}</span>
      </div>
    `).join('') || '<div class="muted">no data</div>';

    document.getElementById('argo-apps').innerHTML = data.argo_apps.map(a => `
      <div class="row">
        <span>${dot(a.sync_status === 'Synced' && a.health_status === 'Healthy' ? 'ok' : 'warn')}${a.name}</span>
        <span class="muted">${a.sync_status} / ${a.health_status}</span>
      </div>
    `).join('') || '<div class="muted">no data</div>';

    const api = data.api_health;
    document.getElementById('api-health').innerHTML = api.reachable
      ? `<div class="row">${dot(api.status_code === 200 ? 'ok' : 'bad')}api.home/health<span class="muted">HTTP ${api.status_code}</span></div>`
      : `<div class="row">${dot('bad')}api.home/health<span class="muted">unreachable</span></div>`;

    const podsByStatus = {};
    data.pods.forEach(p => {
      const key = p.phase === 'Running' && p.ready === p.total ? 'ok' : (p.phase === 'Succeeded' ? 'muted' : 'bad');
      podsByStatus[key] = (podsByStatus[key] || 0) + 1;
    });
    document.getElementById('pods').innerHTML = data.pods.map(p => `
      <div class="row">
        <span>${dot(p.phase === 'Running' && p.ready === p.total ? 'ok' : (p.phase === 'Succeeded' ? 'ok' : 'bad'))}${p.name}</span>
        <span class="muted">${p.namespace} · ${p.ready}/${p.total} · ${p.node || '?'}</span>
      </div>
    `).join('') || '<div class="muted">no data</div>';

    const m = data.pi_metrics || {};
    // Raspberry Pi 5 is a fixed quad-core board, so load is scaled against 4 cores.
    const PI_CORES = 4;
    const tempColor = severityColor(m.cpu_temp_c, 60, 80);
    const loadColor = severityColor(m.load1, PI_CORES * 0.5, PI_CORES);
    const oomColor = m.oom_kills ? '#f85149' : '#3fb950';

    document.getElementById('pi-metrics').innerHTML = `
      <div class="stat-grid">
        <div class="stat-tile">
          <span class="stat-label">CPU temp</span>
          <span class="stat-num" style="color:${tempColor}">${m.cpu_temp_c != null ? m.cpu_temp_c.toFixed(1) + ' °C' : 'n/a'}</span>
          ${bar(m.cpu_temp_c != null ? m.cpu_temp_c : 0, tempColor)}
        </div>
        <div class="stat-tile">
          <span class="stat-label">Load (1m)</span>
          <span class="stat-num" style="color:${loadColor}">${fmtNum(m.load1)}</span>
          ${bar(m.load1 != null ? (m.load1 / PI_CORES) * 100 : 0, loadColor)}
          <span class="stat-sub">5m ${fmtNum(m.load5)} · 15m ${fmtNum(m.load15)}</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Network RX / TX</span>
          <span class="stat-num">${fmtBytesPerSec(m.net_rx_bytes_per_sec)}</span>
          <span class="stat-sub">TX ${fmtBytesPerSec(m.net_tx_bytes_per_sec)}</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">Disk read / write</span>
          <span class="stat-num">${fmtBytesPerSec(m.disk_read_bytes_per_sec)}</span>
          <span class="stat-sub">write ${fmtBytesPerSec(m.disk_write_bytes_per_sec)}</span>
        </div>
        <div class="stat-tile">
          <span class="stat-label">OOM kills</span>
          <span class="stat-num" style="color:${oomColor}">${m.oom_kills != null ? m.oom_kills : 'n/a'}</span>
        </div>
      </div>
    `;

    const gamingStatus = document.getElementById('gaming-status');
    gamingStatus.innerHTML = data.gaming_mode_active
      ? `${dot('warn')}Gaming mode ON — desktop off the cluster`
      : `${dot('ok')}Gaming mode OFF — desktop in the cluster`;
  } catch (e) {
    console.error('status refresh failed', e);
  }
}

async function runGaming(action) {
  const btnOn = document.getElementById('btn-on');
  const btnOff = document.getElementById('btn-off');
  const output = document.getElementById('gaming-output');
  btnOn.disabled = true;
  btnOff.disabled = true;
  output.style.display = 'block';
  output.textContent = `Running ${action === 'on' ? 'pregame' : 'postgame'}.ps1 over SSH — this can take up to ${action === 'on' ? '2' : '3'} minutes...`;

  try {
    const res = await fetch(`/api/gaming/${action}`, { method: 'POST' });
    const data = await res.json();
    output.textContent = (data.success ? '✔ succeeded\n\n' : '✘ failed\n\n') + (data.output || '');
  } catch (e) {
    output.textContent = 'Request failed: ' + e;
  } finally {
    btnOn.disabled = false;
    btnOff.disabled = false;
    refresh();
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
