<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homelab Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; font-size: 18px; }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 1.05rem; }
  .top-row { display: flex; gap: 20px; align-items: stretch; margin-bottom: 24px; flex-wrap: wrap; }
  .top-left { display: flex; flex-direction: column; gap: 16px; flex: 0 0 auto; }
  .top-right { flex: 1; min-width: 320px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; align-items: start; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 1.2rem; margin: 0 0 12px; color: #c9d1d9; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border: 1px solid #21262d; border-radius: 6px; font-size: 1rem; gap: 8px; margin-bottom: 4px; }
  .row:last-child { margin-bottom: 0; }
  .row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row > span:last-child { flex-shrink: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .ok { background: #3fb950; }
  .bad { background: #f85149; }
  .warn { background: #d29922; }
  .muted { color: #8b949e; font-size: 0.95rem; }
  button { background: #238636; color: white; border: none; border-radius: 6px; padding: 12px 20px; font-size: 1.05rem; cursor: pointer; }
  button.off { background: #6e40c9; }
  button:disabled { background: #30363d; cursor: not-allowed; }
  .button-link { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 12px 20px; font-size: 1.05rem; text-decoration: none; display: inline-flex; align-items: center; }
  .button-link:hover { background: #30363d; }
  #login-row { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
  #login-row input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-size: 1.05rem; }
  #login-error { color: #f85149; font-size: 0.95rem; }
  #auth-note { color: #8b949e; font-size: 0.95rem; display: none; }
  #gpu-output { white-space: pre-wrap; background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-top: 12px; font-family: ui-monospace, monospace; font-size: 0.9rem; max-height: 300px; overflow-y: auto; display: none; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .stat-tile { display: flex; flex-direction: column; justify-content: center; gap: 10px; background: #0d1117; border: 1px solid #21262d; border-left: 3px solid #30363d; border-radius: 6px; padding: 20px; min-height: 140px; }
  .stat-label { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-num { font-size: 2.4rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: -0.01em; }
  .stat-sub { font-size: 0.85rem; color: #8b949e; }
  .bar-track { background: #21262d; border-radius: 6px; height: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease, background-color 0.5s ease; }
  .compact .stat-tile { padding: 12px; min-height: auto; gap: 6px; }
  .compact .stat-num { font-size: 1.6rem; }
</style>
</head>
<body>
  <div class="top-row">
    <div class="top-left">
      <div class="header">
        <h1>Homelab Dashboard</h1>
        <div class="sub">Pi 5 + M1 K3s cluster — refreshes every 10s</div>
      </div>
      <div class="header-actions">
        <button id="btn-release" onclick="releaseGpu()">Free the GPU</button>
        <a class="button-link" href="http://grafana.home" target="_blank" rel="noopener">Open Grafana</a>
        <button id="btn-logout" class="button-link" onclick="logout()" style="display:none;">Log out</button>
      </div>
      <form id="login-row" onsubmit="login(event)">
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Dashboard password">
        <button type="submit">Log in</button>
        <span id="login-error"></span>
      </form>
      <div id="auth-note"></div>
      <div id="gpu-output"></div>
    </div>
    <div class="card top-right">
      <h2>Pi metrics</h2>
      <div id="pi-metrics" class="compact"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 24px;">
    <h2>Alerts</h2>
    <div id="alerts"></div>
  </div>

  <div class="card" style="margin-bottom: 24px;">
    <h2>Backups</h2>
    <div id="backups"></div>
    <div id="cross-node-status" style="margin-top: 12px;"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Pods</h2>
      <div id="pods"></div>
    </div>
    <div class="card">
      <h2>Argo CD Applications</h2>
      <div id="argo-apps"></div>
    </div>
    <div class="card">
      <h2>Nodes</h2>
      <div id="nodes"></div>
    </div>
    <div class="card">
      <h2>API</h2>
      <div id="api-health"></div>
    </div>
  </div>

<script>
function dot(cls) { return `<span class="dot ${cls}"></span>`; }

function fmtBytesPerSec(v) {
  if (v === null || v === undefined) return 'n/a';
  const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
  let i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(1)} ${units[i]}`;
}

function fmtNum(v, digits = 1) {
  return (v === null || v === undefined) ? 'n/a' : v.toFixed(digits);
}

function severityColor(v, warn, bad) {
  return v == null ? '#8b949e' : (v >= bad ? '#f85149' : (v >= warn ? '#d29922' : '#3fb950'));
}

function bar(pct, color) {
  const clamped = Math.max(0, Math.min(100, pct));
  return `<div class="bar-track"><div class="bar-fill" style="width:${clamped}%;background:${color}"></div></div>`;
}

function renderMetricsCard(elementId, metrics, { cores, showTemp }) {
  const m = metrics || {};
  const loadColor = severityColor(m.load1, cores * 0.5, cores);
  const oomColor = m.oom_kills ? '#f85149' : '#3fb950';

  const tempTile = showTemp ? (() => {
    const tempColor = severityColor(m.cpu_temp_c, 60, 80);
    return `
      <div class="stat-tile" style="border-left-color:${tempColor}">
        <span class="stat-label">CPU temp</span>
        <span class="stat-num" style="color:${tempColor}">${m.cpu_temp_c != null ? m.cpu_temp_c.toFixed(1) + ' °C' : 'n/a'}</span>
        ${bar(m.cpu_temp_c != null ? m.cpu_temp_c : 0, tempColor)}
      </div>
    `;
  })() : '';

  document.getElementById(elementId).innerHTML = `
    <div class="stat-grid">
      ${tempTile}
      <div class="stat-tile" style="border-left-color:${loadColor}">
        <span class="stat-label">Load (1m)</span>
        <span class="stat-num" style="color:${loadColor}">${fmtNum(m.load1)}</span>
        ${bar(m.load1 != null ? (m.load1 / cores) * 100 : 0, loadColor)}
        <span class="stat-sub">5m ${fmtNum(m.load5)} · 15m ${fmtNum(m.load15)}</span>
      </div>
      <div class="stat-tile" style="border-left-color:#58a6ff">
        <span class="stat-label">Network RX / TX</span>
        <span class="stat-num">${fmtBytesPerSec(m.net_rx_bytes_per_sec)}</span>
        <span class="stat-sub">TX ${fmtBytesPerSec(m.net_tx_bytes_per_sec)}</span>
      </div>
      <div class="stat-tile" style="border-left-color:#58a6ff">
        <span class="stat-label">Disk read / write</span>
        <span class="stat-num">${fmtBytesPerSec(m.disk_read_bytes_per_sec)}</span>
        <span class="stat-sub">write ${fmtBytesPerSec(m.disk_write_bytes_per_sec)}</span>
      </div>
      <div class="stat-tile" style="border-left-color:${oomColor}">
        <span class="stat-label">OOM kills</span>
        <span class="stat-num" style="color:${oomColor}">${m.oom_kills != null ? m.oom_kills : 'n/a'}</span>
      </div>
    </div>
  `;
}

async function refresh() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();

    // Pod count per node. A node can be Ready, untainted and running
    // nothing at all - nothing reschedules onto a new node on its own -
    // and "Ready" alone hides that completely.
    const perNode = data.pods_per_node || {};
    document.getElementById('nodes').innerHTML = data.nodes.map(n => {
      const count = perNode[n.name];
      const idle = n.ready && count === 0;
      const state = n.ready ? (idle ? 'warn' : 'ok') : 'bad';
      const detail = !n.ready ? 'NotReady'
        : (idle ? 'Ready but running nothing' : `Ready · ${count} pod${count === 1 ? '' : 's'}`);
      return `
      <div class="row">
        <span>${dot(state)}${n.name}</span>
        <span class="muted">${detail}${n.schedulable ? '' : ', cordoned'}</span>
      </div>`;
    }).join('') || '<div class="muted">no data</div>';

    document.getElementById('argo-apps').innerHTML = data.argo_apps.map(a => `
      <div class="row">
        <span>${dot(a.sync_status === 'Synced' && a.health_status === 'Healthy' ? 'ok' : 'warn')}${a.name}</span>
        <span class="muted">${a.sync_status} / ${a.health_status}</span>
      </div>
    `).join('') || '<div class="muted">no data</div>';

    const api = data.api_health;
    document.getElementById('api-health').innerHTML = api.reachable
      ? `<div class="row">${dot(api.status_code === 200 ? 'ok' : 'bad')}api.home/health<span class="muted">HTTP ${api.status_code}</span></div>`
      : `<div class="row">${dot('bad')}api.home/health<span class="muted">unreachable</span></div>`;

    const podsByStatus = {};
    data.pods.forEach(p => {
      const key = p.phase === 'Running' && p.ready === p.total ? 'ok' : (p.phase === 'Succeeded' ? 'muted' : 'bad');
      podsByStatus[key] = (podsByStatus[key] || 0) + 1;
    });
    document.getElementById('pods').innerHTML = data.pods.map(p => `
      <div class="row">
        <span title="${p.name}">${dot(p.phase === 'Running' && p.ready === p.total ? 'ok' : (p.phase === 'Succeeded' ? 'ok' : 'bad'))}${p.name}</span>
        <span class="muted">${p.namespace} · ${p.ready}/${p.total} · ${p.node || '?'}</span>
      </div>
    `).join('') || '<div class="muted">no data</div>';

    renderMetricsCard('pi-metrics', data.pi_metrics, { cores: 4, showTemp: true });

    const crossNode = data.cross_node_status;
    const crossNodeDot = crossNode === 'up' ? 'ok' : (crossNode === 'down' ? 'bad' : 'warn');
    // "Unknown" here almost always means the worker is running no scraped
    // pods, not that monitoring is broken. Saying so is more useful than
    // reporting an absence the reader has to interpret.
    const crossNodeLabel = crossNode === 'up' ? 'Worker pod scrapes succeeding' : (crossNode === 'down' ? 'A worker pod scrape is failing' : 'No scraped pods on a worker node yet');
    document.getElementById('cross-node-status').innerHTML = `
      <div class="row">
        <span>${dot(crossNodeDot)}Cross-node scrape health</span>
        <span class="muted">${crossNodeLabel}</span>
      </div>
    `;

    // Alerts. null means Alertmanager could not be reached, which must not
    // look like 'nothing is firing' on a page whose job is to tell you
    // something is wrong.
    const alerts = data.alerts;
    document.getElementById('alerts').innerHTML =
      alerts === null
        ? `<div class="row">${dot('warn')}Alertmanager unreachable<span class="muted">cannot tell what is firing</span></div>`
        : (alerts.length === 0
          ? `<div class="row">${dot('ok')}Nothing firing<span class="muted">${'all clear'}</span></div>`
          : alerts.map(a => `
      <div class="row">
        <span>${dot(a.severity === 'critical' ? 'bad' : 'warn')}${a.name}</span>
        <span class="muted">${a.summary || a.severity || a.state}</span>
      </div>`).join(''));

    // Backups. Age is the headline because it stays true whatever went
    // wrong; the exit code only describes runs that actually happened.
    const b = data.backup || {};
    const backupRows = [];
    const age = b.backup_age_hours;
    if (age === null || age === undefined) {
      backupRows.push([dot('bad'), 'Last backup', 'no data - nothing is reporting']);
    } else {
      const d = age > 26 ? 'bad' : (age > 12 ? 'warn' : 'ok');
      backupRows.push([dot(d), 'Last backup', `${fmtNum(age, 1)} h ago` + (age > 26 ? ' - overdue' : '')]);
    }
    const exitCode = b.backup_last_exit_code;
    if (exitCode !== null && exitCode !== undefined) {
      backupRows.push([dot(exitCode === 0 ? 'ok' : 'bad'), 'Last run exit code',
        exitCode === 0 ? '0' : `${exitCode} - the log may still read "succeeded"`]);
    }
    if (b.backup_repository_readable !== null && b.backup_repository_readable !== undefined) {
      backupRows.push([dot(b.backup_repository_readable === 1 ? 'ok' : 'bad'), 'Repository',
        b.backup_repository_readable === 1 ? 'readable' : 'restic could not list it']);
    }
    if (b.backup_snapshot_count !== null && b.backup_snapshot_count !== undefined) {
      backupRows.push(['', 'Snapshots', `${fmtNum(b.backup_snapshot_count, 0)}`]);
    }
    const reportAge = b.backup_report_age_hours;
    if (reportAge !== null && reportAge !== undefined && reportAge > 3) {
      backupRows.push([dot('warn'), 'Reporter', `${fmtNum(reportAge, 1)} h stale - figures above may be out of date`]);
    }
    const inference = b.inference_reachable;
    if (inference !== null && inference !== undefined) {
      backupRows.push([dot(inference === 1 ? 'ok' : 'warn'), 'Inference (desktop)',
        inference === 1 ? 'reachable' : 'unreachable - desktop asleep or Ollama down']);
    }
    document.getElementById('backups').innerHTML = backupRows.map(
      ([d, label, detail]) => `<div class="row"><span>${d}${label}</span><span class="muted">${detail}</span></div>`
    ).join('');
    gpuModels = data.gpu_models;
    applyAuthState();
  } catch (e) {
    console.error('status refresh failed', e);
  }
}

// Sent with every state-changing request. The JSON content type is what
// makes these non-simple, so a cross-origin copy of this call has to clear
// a preflight the server never answers - a second line behind the session
// cookie, not a replacement for it.
const JSON_POST = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' };

let authed = false;
let authConfigured = true;
let gpuModels = null;

function applyAuthState() {
  // Enabled whenever you are logged in, including when nothing is
  // resident. Ollama evicts on its own after an idle period, so pressing
  // this on an already-idle GPU is a harmless no-op rather than an error,
  // and greying it out would only raise the question of why.
  const btn = document.getElementById('btn-release');
  btn.disabled = !authed;
  const n = Array.isArray(gpuModels) ? gpuModels.length : null;
  btn.textContent = n === null ? 'Free the GPU'
    : n === 0 ? 'Free the GPU (idle)'
    : 'Free the GPU (' + n + ' model' + (n > 1 ? 's' : '') + ' resident)';
  document.getElementById('btn-logout').style.display = authed ? 'inline-flex' : 'none';
  document.getElementById('login-row').style.display = (!authed && authConfigured) ? 'flex' : 'none';

  const note = document.getElementById('auth-note');
  if (!authConfigured) {
    note.style.display = 'block';
    note.textContent = 'The GPU control is unavailable: the dashboard-auth Secret has not been applied. See docs/dashboard.md.';
  } else {
    note.style.display = 'none';
  }
}

async function refreshSession() {
  try {
    const res = await fetch('/api/session');
    const data = await res.json();
    authed = data.authenticated;
    authConfigured = data.configured;
  } catch (e) {
    authed = false;
  }
  applyAuthState();
}

async function login(event) {
  event.preventDefault();
  const input = document.getElementById('login-password');
  const error = document.getElementById('login-error');
  error.textContent = '';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: input.value }),
    });
    if (!res.ok) {
      error.textContent = res.status === 401 ? 'Incorrect password.' : `Login failed (HTTP ${res.status}).`;
      return;
    }
    input.value = '';
    await refreshSession();
  } catch (e) {
    error.textContent = 'Login request failed: ' + e;
  }
}

async function logout() {
  try {
    await fetch('/api/logout', JSON_POST);
  } finally {
    await refreshSession();
  }
}

async function releaseGpu() {
  const btn = document.getElementById('btn-release');
  const output = document.getElementById('gpu-output');
  btn.disabled = true;
  output.style.display = 'block';
  output.textContent = 'Evicting resident models from VRAM...';

  try {
    const res = await fetch('/api/gpu/release', JSON_POST);
    if (res.status === 401) {
      output.textContent = 'Session expired — log in again.';
      await refreshSession();
      return;
    }
    const data = await res.json();
    if (res.status === 502) {
      output.textContent = '✘ ' + (data.detail || 'Ollama unreachable');
      return;
    }
    const gb = (data.vram_freed_bytes || 0) / 1073741824;
    if (data.success && data.evicted.length === 0) {
      output.textContent = '✔ GPU was already idle — nothing resident.';
    } else if (data.success) {
      output.textContent = '✔ Freed ' + gb.toFixed(1) + ' GB — evicted ' + data.evicted.join(', ') + '.';
    } else {
      const nl = String.fromCharCode(10);
      output.textContent = '✘ Still resident: ' + data.still_loaded.join(', ')
        + nl + nl + (data.errors || []).join(nl);
    }
  } catch (e) {
    output.textContent = 'Request failed: ' + e;
  } finally {
    applyAuthState();
    refresh();
  }
}

applyAuthState();
refreshSession();
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
