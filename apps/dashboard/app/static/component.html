<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab - details</title>
<style>
  :root {
    --bg: #0b0b0b; --panel: #141413; --panel-2: #1c1c1a; --line: #2C2C2A; --text: #F1EFE8; --muted: #888780;
    --faint: #5F5E5A; --ok: #97C459; --warn: #EF9F27; --bad: #E24B4A; --info: #85B7EB;
  }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; }
  /* The Pi's touchscreen scrolls by dragging; no rubber-banding back to the map. */
  body { overscroll-behavior: none; touch-action: pan-y; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px;
    padding: 10px 18px; background: rgba(11, 11, 11, .94); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 24px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  button { font: inherit; border: 0; border-radius: 999px; cursor: pointer; }
  /* Big enough for a finger on the Pi's screen. */
  #back { background: #2C2C2A; color: #F1EFE8; font-size: 18px; font-weight: 600; padding: 10px 24px; }
  #refresh { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 16px; }
  #updated { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .pill { padding: 3px 12px; border-radius: 999px; font-size: 15px; white-space: nowrap; }
  .pill.up, .pill.ok { background: #173404; color: #C0DD97; }
  .pill.down, .pill.bad { background: #501313; color: #F7C1C1; }
  .pill.unknown { background: #2C2C2A; color: #B4B2A9; }
  .pill.warn { background: #412402; color: #FAC775; }
  main { max-width: 1240px; margin: 0 auto; padding: 14px 18px 60px; }
  .about { color: #B4B2A9; margin: 4px 0 16px; line-height: 1.45; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; font-weight: 650; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  #diagram > svg { width: 100%; height: auto; display: block; }
  #diagram a { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: 13px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; }
  .legend svg { margin-right: 7px; flex: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .metric .label { color: var(--muted); font-size: 13px; }
  .metric .value { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .metric.good { border-color: #2d4a14; } .metric.good .value { color: var(--ok); }
  .metric.bad { border-color: #6a1d1d; } .metric.bad .value { color: var(--bad); }
  .pod { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
  .pod.notready { border-color: #6a1d1d; }
  .pod .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .pod .name { font-weight: 650; font-size: 17px; word-break: break-all; }
  .kv { color: var(--muted); font-size: 14px; }
  .kv b { color: var(--text); font-weight: 600; }
  .bar { display: inline-block; width: 90px; height: 7px; border-radius: 4px; background: #2C2C2A; vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .container { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  .container .cname { font-weight: 600; }
  .container .img { color: var(--faint); word-break: break-all; }
  .warnline { color: var(--warn); } .badline { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.Warning { color: var(--warn); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  details.previous { border-color: #5a3a10; }
  summary { padding: 11px 14px; cursor: pointer; font-weight: 600; list-style-position: inside; }
  summary .kv { font-weight: 400; margin-left: 8px; }
  pre { margin: 0; padding: 10px 14px; max-height: 420px; overflow: auto; background: #0f0f0e; border-top: 1px solid var(--line);
    font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  pre .err { color: #F7A1A0; } pre .wrn { color: #FAC775; } pre .ts { color: var(--faint); }
  .empty { color: var(--muted); font-style: italic; }
  .cmd { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .cmd code { flex: 1; background: #0f0f0e; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font: 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow-x: auto; white-space: pre; }
  .cmd button { background: #2C2C2A; color: #D3D1C7; padding: 7px 14px; font-size: 13px; }
  #error { display: none; margin: 12px 0; }
  @media (max-width: 700px) { header { flex-wrap: wrap; } #updated { display: none; } }
</style>
</head>
<body>
<header>
  <button id="back" type="button">‹ Back</button>
  <h1 id="title">Loading…</h1>
  <span class="pill unknown" id="status">-</span>
  <span class="spacer"></span>
  <span id="updated"></span>
  <button id="refresh" type="button">Refresh</button>
</header>
<main>
  <p class="about" id="about"></p>
  <div class="pill bad" id="error"></div>
  <section id="sections"></section>
</main>
<script src="/static/component.js"></script>
</body>
</html>
