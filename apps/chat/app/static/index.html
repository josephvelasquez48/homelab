<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homelab Chat</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100vh; display: flex;
  }
  #sidebar {
    width: 260px; flex: 0 0 260px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #sidebar h1 { font-size: 15px; margin: 0; padding: 16px; border-bottom: 1px solid var(--line); }
  #model { margin: 12px 12px 0; padding: 7px; background: var(--bg); color: var(--text);
           border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; }
  #new { margin: 8px 12px 12px; padding: 9px; background: var(--accent); color: #04260d;
         border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .conv { padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
          color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .conv .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Hidden until hover so the list stays calm, but focusable by keyboard */
  .conv .del { flex: 0 0 auto; opacity: 0; border: 0; background: none; cursor: pointer;
               color: var(--muted); font-size: 15px; line-height: 1; padding: 2px 4px; }
  .conv:hover .del, .conv .del:focus { opacity: 1; }
  .conv .del:hover { color: var(--bad); }
  .conv:hover { background: #1f2630; color: var(--text); }
  .conv.active { background: #1f2630; color: var(--text); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 760px; margin: 0 auto 20px; display: flex; gap: 12px; }
  .who { flex: 0 0 64px; color: var(--muted); font-size: 12px; padding-top: 3px; text-transform: uppercase; }
  .body { flex: 1; white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
  .msg.error .body { color: var(--bad); }
  #composer { border-top: 1px solid var(--line); padding: 16px; }
  #composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; background: var(--panel); color: var(--text);
           border: 1px solid var(--line); border-radius: 8px; padding: 11px; font: inherit; }
  #send { padding: 0 20px; background: var(--accent); color: #04260d; border: 0;
          border-radius: 8px; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .45; cursor: default; }
  #status { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Homelab Chat</h1>
    <select id="model" title="Model for new conversations"></select>
    <button id="new">New conversation</button>
    <div id="list"></div>
  </div>

  <div id="main">
    <div id="thread"><div class="empty">Start a conversation.</div></div>
    <div id="composer">
      <form id="composer-form">
        <textarea id="input" rows="2" placeholder="Ask something..."></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

<script>
let current = null;
let streaming = false;

const el = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

async function loadList() {
  const res = await fetch('/api/conversations');
  const items = await res.json();
  el('list').innerHTML = items.map(c =>
    '<div class="conv' + (c.id === current ? ' active' : '') + '" data-id="' + c.id + '">'
    + '<span class="label">' + esc(c.title || 'Untitled') + '</span>'
    + '<button class="del" title="Delete this conversation" aria-label="Delete conversation">&times;</button>'
    + '</div>').join('');
}

async function newConversation() {
  const chosen = el('model').value;
  const res = await fetch('/api/conversations', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(chosen ? { model: chosen } : {})
  });
  const conv = await res.json();
  current = conv.id;
  el('thread').innerHTML = '<div class="empty">Ask the first question.</div>';
  await loadList();
  el('input').focus();
}

async function open_(id) {
  current = id;
  const res = await fetch('/api/conversations/' + id);
  const conv = await res.json();
  el('thread').innerHTML = conv.messages.map(m => bubble(m.role, m.content)).join('')
    || '<div class="empty">Ask the first question.</div>';
  // A conversation keeps the model it was created with, so say which.
  el('status').textContent = conv.model ? 'Model: ' + conv.model : '';
  scrollDown();
  await loadList();
}

function bubble(role, content, cls) {
  return '<div class="msg ' + (cls || '') + '"><div class="who">' + role + '</div>'
    + '<div class="body">' + esc(content) + '</div></div>';
}

async function remove(id) {
  // Deleting cascades to every message in the conversation and there is no
  // undo, so this asks first. It is the only destructive action in the UI.
  if (!confirm('Delete this conversation and all its messages?')) return;

  const res = await fetch('/api/conversations/' + id, { method: 'DELETE' });
  if (!res.ok && res.status !== 204) {
    el('status').textContent = 'Could not delete that conversation.';
    return;
  }
  // Only clear the thread if the deleted conversation is the one on screen.
  if (id === current) {
    current = null;
    el('thread').innerHTML = '<div class="empty">Start a conversation.</div>';
  }
  el('status').textContent = '';
  await loadList();
}

function scrollDown() { const t = el('thread'); t.scrollTop = t.scrollHeight; }

function maybeSend(event) {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(event); }
}

async function send(event) {
  event.preventDefault();
  if (streaming) return;
  const text = el('input').value.trim();
  if (!text) { el('status').textContent = 'Type a message first.'; return; }
  if (!current) await newConversation();

  el('input').value = '';
  if (el('thread').querySelector('.empty')) el('thread').innerHTML = '';
  el('thread').insertAdjacentHTML('beforeend', bubble('you', text));

  // The reply element exists before any token arrives, so the cold-start
  // wait has somewhere to show rather than looking like nothing happened.
  el('thread').insertAdjacentHTML('beforeend', bubble('llm', ''));
  const target = el('thread').lastElementChild.querySelector('.body');
  scrollDown();

  streaming = true;
  el('send').disabled = true;
  // Roughly how long a cold model load takes on this hardware. Saying so
  // is better than a spinner that gives no sense of whether to keep waiting.
  const slow = setTimeout(() => {
    if (!target.textContent) el('status').textContent = 'Loading the model into VRAM, this takes about 45 seconds when it has been idle.';
  }, 4000);

  try {
    const res = await fetch('/api/conversations/' + current + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let tokens = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // Frames are separated by a blank line. Anything after the last
      // separator is a partial frame and has to stay in the buffer.
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const frame = JSON.parse(line.slice(5).trim());

        if (frame.error) {
          target.parentElement.classList.add('error');
          target.textContent = frame.error;
          el('status').textContent = '';
        } else if (frame.token) {
          if (!tokens) { clearTimeout(slow); el('status').textContent = 'Generating...'; }
          tokens++;
          target.textContent += frame.token;
          scrollDown();
        } else if (frame.done) {
          el('status').textContent = frame.tokens_per_sec
            ? frame.tokens_per_sec + ' tokens/sec' : '';
        }
      }
    }
  } catch (err) {
    target.parentElement.classList.add('error');
    target.textContent = 'Connection failed: ' + err.message;
  } finally {
    clearTimeout(slow);
    streaming = false;
    el('send').disabled = false;
    el('input').focus();
    loadList();
  }
}

// Handlers are bound here rather than as inline attributes, because an
// inline handler on a form runs with that form's own controls in scope.
// A control whose id matches a global shadows it. That is exactly what
// broke Send: the button is id="send" and the function is named send, so
// inside onsubmit="send(event)" the name resolved to the button element.
// Calling it threw, preventDefault never ran, and the browser fell back to
// a native form submit that reloaded the page. Enter kept working because
// it goes through a handler on the textarea, where normal scoping applies.
document.getElementById('composer-form').addEventListener('submit', send);
document.getElementById('new').addEventListener('click', newConversation);
document.getElementById('input').addEventListener('keydown', maybeSend);
document.getElementById('list').addEventListener('click', (event) => {
  const row = event.target.closest('.conv');
  if (!row) return;
  // The delete control sits inside the row, so its click would otherwise
  // also open the conversation it is removing.
  if (event.target.closest('.del')) remove(row.dataset.id);
  else open_(row.dataset.id);
});

async function loadModels() {
  const options = await (await fetch("/api/models")).json();
  el("model").innerHTML = options.map(o =>
    '<option value="' + o.model + '">' + esc(o.label) + '</option>').join("");
}

loadModels();
loadList();
</script>
</body>
</html>
