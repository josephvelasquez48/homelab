<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homelab Chat</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    /* 100vh on iOS Safari is the viewport with the URL bar hidden, so a
       full-height column overflows and pushes the composer below the fold
       until you scroll. dvh tracks the bar; vh stays for browsers without it. */
    height: 100vh; height: 100dvh; display: flex;
  }
  #sidebar {
    width: 260px; flex: 0 0 260px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; background: var(--panel);
  }
  #sidebar h1 { font-size: 15px; margin: 0; padding: 16px; border-bottom: 1px solid var(--line); }
  #model { margin: 12px 12px 0; padding: 7px; background: var(--bg); color: var(--text);
           border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; }
  #new { margin: 8px 12px 12px; padding: 9px; background: var(--accent); color: #04260d;
         border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .conv { padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
          color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .conv .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Hidden until hover so the list stays calm, but focusable by keyboard */
  .conv .del { flex: 0 0 auto; opacity: 0; border: 0; background: none; cursor: pointer;
               color: var(--muted); font-size: 15px; line-height: 1; padding: 2px 4px; }
  .conv:hover .del, .conv .del:focus { opacity: 1; }
  .conv .del:hover { color: var(--bad); }
  .conv:hover { background: #1f2630; color: var(--text); }
  .conv.active { background: #1f2630; color: var(--text); }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { display: none; }
  #backdrop { display: none; }
  #thread { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 760px; margin: 0 auto 20px; display: flex; gap: 12px; }
  .who { flex: 0 0 64px; color: var(--muted); font-size: 12px; padding-top: 3px; text-transform: uppercase; }
  .body { flex: 1; white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
  .msg.error .body { color: var(--bad); }
  #composer { border-top: 1px solid var(--line); padding: 16px; }
  #composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; background: var(--panel); color: var(--text);
           border: 1px solid var(--line); border-radius: 8px; padding: 11px; font: inherit; }
  #send { padding: 0 20px; background: var(--accent); color: #04260d; border: 0;
          border-radius: 8px; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .45; cursor: default; }
  #opts { max-width: 760px; margin: 10px auto 0; font-size: 13px; color: var(--muted);
          display: flex; align-items: center; gap: 7px; }
  #opts label { cursor: pointer; }
  .body a { color: var(--accent); }
  /* A citation has to look clickable without turning the answer into a
     field of links, so it reads as a marker rather than as body text. */
  .cite { color: var(--accent); text-decoration: none; font-size: 12px;
          vertical-align: super; padding: 0 1px; }
  .cite:hover { text-decoration: underline; }
  .src { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--panel); font-size: 13px; }
  .src > summary { cursor: pointer; padding: 8px 11px; color: var(--muted); }
  .src ol { margin: 0; padding: 0 14px 10px 30px; }
  .src li { margin-bottom: 10px; }
  .src li p { margin: 3px 0 0; color: var(--muted); white-space: normal; }
  .arch { font-size: 11px; color: var(--muted); border: 1px solid var(--line);
          border-radius: 10px; padding: 1px 7px; margin-left: 6px; }
  #status { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }

  /* Below this the 260px sidebar leaves too little for the conversation:
     at 375px the thread column collapses to about one character per line.
     So the sidebar becomes a drawer over the thread rather than beside it. */
  @media (max-width: 700px) {
    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
      transform: translateX(-100%); transition: transform .18s ease;
      padding-top: env(safe-area-inset-top);
    }
    body.nav-open #sidebar { transform: none; }
    /* Catches the tap that closes the drawer. Without it the only way back
       is the menu button, which is underneath the drawer. */
    body.nav-open #backdrop {
      display: block; position: fixed; inset: 0; z-index: 10;
      background: rgba(0, 0, 0, .5);
    }
    #bar {
      display: flex; align-items: center; gap: 10px;
      padding: env(safe-area-inset-top) 12px 0;
      height: calc(46px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--line); background: var(--panel);
    }
    #bar h1 { font-size: 15px; margin: 0; }
    #menu {
      background: none; border: 0; color: var(--text); font-size: 21px;
      line-height: 1; padding: 4px 6px; cursor: pointer;
    }
    #thread { padding: 16px 14px; }
    /* The role label moves above the message. As a 64px column it took a
       sixth of the width and forced the text into a narrow gutter. */
    .msg { flex-direction: column; gap: 1px; margin-bottom: 16px; }
    .who { flex: none; padding-top: 0; font-size: 11px; }
    #composer { padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
    /* iOS zooms the whole page when focusing an input under 16px, and does
       not zoom back out afterwards. */
    #input { font-size: 16px; }
  }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>Homelab Chat</h1>
    <select id="model" title="Model for new conversations"></select>
    <button id="new">New conversation</button>
    <div id="list"></div>
  </div>

  <div id="backdrop"></div>

  <div id="main">
    <div id="bar">
      <button id="menu" aria-label="Show conversations" aria-expanded="false">&#9776;</button>
      <h1>Homelab Chat</h1>
    </div>
    <div id="thread"><div class="empty">Start a conversation.</div></div>
    <div id="composer">
      <form id="composer-form">
        <textarea id="input" rows="2" placeholder="Ask something..."></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <div id="opts">
        <input type="checkbox" id="retrieve">
        <label for="retrieve">Look it up in Wikipedia first</label>
      </div>
      <div id="status"></div>
    </div>
  </div>

<script>
let current = null;
let streaming = false;

const el = (id) => document.getElementById(id);
// Escapes quotes as well as tags, because these values are interpolated
// into attributes and not only into text. The usual trick of assigning to
// textContent and reading innerHTML back does not: a title containing a
// double quote closes the attribute early, and `Ada" onmouseover="alert(1)`
// becomes a real event handler on the citation link.
const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESCAPES[c]);

async function loadList() {
  const res = await fetch('/api/conversations');
  const items = await res.json();
  el('list').innerHTML = items.map(c =>
    '<div class="conv' + (c.id === current ? ' active' : '') + '" data-id="' + c.id + '">'
    + '<span class="label">' + esc(c.title || 'Untitled') + '</span>'
    + '<button class="del" title="Delete this conversation" aria-label="Delete conversation">&times;</button>'
    + '</div>').join('');
}

async function newConversation() {
  nav(false);
  const chosen = el('model').value;
  const res = await fetch('/api/conversations', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(chosen ? { model: chosen } : {})
  });
  const conv = await res.json();
  current = conv.id;
  el('thread').innerHTML = '<div class="empty">Ask the first question.</div>';
  await loadList();
  el('input').focus();
}

async function open_(id) {
  current = id;
  // On a phone the thread is behind the drawer, so leaving it open would
  // hide the conversation the tap just selected.
  nav(false);
  const res = await fetch('/api/conversations/' + id);
  const conv = await res.json();
  el('thread').innerHTML = conv.messages.map(m => bubble(m.role, m.content, '', m.sources)).join('')
    || '<div class="empty">Ask the first question.</div>';
  // A conversation keeps the model it was created with, so say which.
  el('status').textContent = conv.model ? 'Model: ' + conv.model : '';
  scrollDown();
  await loadList();
}

// Anything a message carries that should become a link is linked at render
// time, after escaping. Doing it before would let a URL someone typed into
// their own message inject markup.
const LINK = /https:\/\/[^\s<>"']+/g;
const CITE = /\[(\d{1,2})\]/g;

// Sources reach the page from the database, so their URLs are not typed
// here and are not necessarily what this code expects. Today zimsearch only
// ever builds https links into wikipedia.home, which is exactly why an
// unchecked href would go unnoticed until something else wrote that column.
// A javascript: URL in an anchor runs on click.
const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//.test(u) ? u : '');

const label = (archive) =>
  archive.indexOf('simple') !== -1 ? 'Simple English' : 'Full English';

// The model is asked to mark borrowed claims as [1], so those markers are
// the natural place to click through to the article. Only numbers that
// actually have a source become links - a 7B model will sometimes cite a
// passage that was never there, and inventing a destination for it would
// disguise exactly the failure worth seeing.
function render(content, sources) {
  let out = esc(content).replace(LINK, (u) =>
    '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>');
  if (!sources || !sources.length) return out;
  const byNumber = {};
  sources.forEach((s) => { byNumber[s.n] = s; });
  return out.replace(CITE, (whole, n) => {
    const src = byNumber[n];
    const href = src ? safeUrl(src.url) : '';
    if (!href) return whole;
    return '<a class="cite" href="' + esc(href) + '" target="_blank" rel="noopener"'
      + ' title="' + esc(src.title) + '">[' + n + ']</a>';
  });
}

// Collapsed by default. The excerpt is what the model was actually handed,
// which is the only way to tell a grounded answer from one that merely
// mentions the same article.
function panel(sources) {
  if (!sources || !sources.length) return '';
  const items = sources.map((s) => {
    const href = safeUrl(s.url);
    // A source whose URL is not a link still gets listed. Dropping it would
    // hide a passage the answer was actually built on.
    const title = href
      ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>'
      : esc(s.title);
    return '<li>' + title
      + '<span class="arch">' + esc(label(s.archive)) + '</span>'
      + '<p>' + esc(s.excerpt) + '</p></li>';
  }).join('');
  const n = sources.length;
  return '<details class="src"><summary>' + n + (n === 1 ? ' source' : ' sources')
    + ' from the local Wikipedia</summary><ol>' + items + '</ol></details>';
}

function bubble(role, content, cls, sources) {
  return '<div class="msg ' + (cls || '') + '"><div class="who">' + role + '</div>'
    + '<div class="body">' + render(content, sources) + panel(sources) + '</div></div>';
}

async function remove(id) {
  // Deleting cascades to every message in the conversation and there is no
  // undo, so this asks first. It is the only destructive action in the UI.
  if (!confirm('Delete this conversation and all its messages?')) return;

  const res = await fetch('/api/conversations/' + id, { method: 'DELETE' });
  if (!res.ok && res.status !== 204) {
    el('status').textContent = 'Could not delete that conversation.';
    return;
  }
  // Only clear the thread if the deleted conversation is the one on screen.
  if (id === current) {
    current = null;
    el('thread').innerHTML = '<div class="empty">Start a conversation.</div>';
  }
  el('status').textContent = '';
  await loadList();
}

function scrollDown() { const t = el('thread'); t.scrollTop = t.scrollHeight; }

function maybeSend(event) {
  if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(event); }
}

async function send(event) {
  event.preventDefault();
  if (streaming) return;
  const text = el('input').value.trim();
  if (!text) { el('status').textContent = 'Type a message first.'; return; }
  if (!current) await newConversation();

  el('input').value = '';
  if (el('thread').querySelector('.empty')) el('thread').innerHTML = '';
  el('thread').insertAdjacentHTML('beforeend', bubble('you', text));

  // The reply element exists before any token arrives, so the cold-start
  // wait has somewhere to show rather than looking like nothing happened.
  el('thread').insertAdjacentHTML('beforeend', bubble('llm', ''));
  const target = el('thread').lastElementChild.querySelector('.body');
  scrollDown();

  streaming = true;
  el('send').disabled = true;
  // Roughly how long a cold model load takes on this hardware. Saying so
  // is better than a spinner that gives no sense of whether to keep waiting.
  if (el('retrieve').checked) el('status').textContent = 'Searching Wikipedia...';
  const slow = setTimeout(() => {
    if (!target.textContent) el('status').textContent = 'Loading the model into VRAM, this takes about 45 seconds when it has been idle.';
  }, 4000);

  try {
    const res = await fetch('/api/conversations/' + current + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, retrieve: el('retrieve').checked })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let tokens = 0;
    // Kept apart from the element's text because the sources panel lands
    // inside the same element at the end, and reading the reply back off
    // the DOM would then sweep the excerpts into it.
    let reply = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // Frames are separated by a blank line. Anything after the last
      // separator is a partial frame and has to stay in the buffer.
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const frame = JSON.parse(line.slice(5).trim());

        if (frame.error) {
          target.parentElement.classList.add('error');
          target.textContent = frame.error;
          el('status').textContent = '';
        } else if (frame.token) {
          if (!tokens) { clearTimeout(slow); el('status').textContent = 'Generating...'; }
          tokens++;
          reply += frame.token;
          // Plain text while it streams. Re-parsing the whole reply on every
          // token to find citations would do quadratic work for markup that
          // cannot be complete until the sources arrive anyway.
          target.textContent = reply;
          scrollDown();
        } else if (frame.sources) {
          // Arrives after the last token, so this is the first point at
          // which the citation numbers can be resolved to articles.
          target.innerHTML = render(reply, frame.sources) + panel(frame.sources);
          scrollDown();
        } else if (frame.done) {
          el('status').textContent = frame.tokens_per_sec
            ? frame.tokens_per_sec + ' tokens/sec' : '';
        }
      }
    }
  } catch (err) {
    target.parentElement.classList.add('error');
    target.textContent = 'Connection failed: ' + err.message;
  } finally {
    clearTimeout(slow);
    streaming = false;
    el('send').disabled = false;
    el('input').focus();
    loadList();
  }
}

// Handlers are bound here rather than as inline attributes, because an
// inline handler on a form runs with that form's own controls in scope.
// A control whose id matches a global shadows it. That is exactly what
// broke Send: the button is id="send" and the function is named send, so
// inside onsubmit="send(event)" the name resolved to the button element.
// Calling it threw, preventDefault never ran, and the browser fell back to
// a native form submit that reloaded the page. Enter kept working because
// it goes through a handler on the textarea, where normal scoping applies.
// The drawer is CSS; this only flips the class it keys off, so the layout
// stays in one place rather than half here and half in the stylesheet. On a
// wide screen the class is inert, so nothing needs to undo it on resize.
function nav(open) {
  document.body.classList.toggle('nav-open', open);
  el('menu').setAttribute('aria-expanded', open ? 'true' : 'false');
}

document.getElementById('menu').addEventListener('click', () => {
  nav(!document.body.classList.contains('nav-open'));
});
document.getElementById('backdrop').addEventListener('click', () => nav(false));
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') nav(false);
});

document.getElementById('composer-form').addEventListener('submit', send);
document.getElementById('new').addEventListener('click', newConversation);
document.getElementById('input').addEventListener('keydown', maybeSend);
document.getElementById('list').addEventListener('click', (event) => {
  const row = event.target.closest('.conv');
  if (!row) return;
  // The delete control sits inside the row, so its click would otherwise
  // also open the conversation it is removing.
  if (event.target.closest('.del')) remove(row.dataset.id);
  else open_(row.dataset.id);
});

async function loadModels() {
  const options = await (await fetch("/api/models")).json();
  el("model").innerHTML = options.map(o =>
    '<option value="' + o.model + '">' + esc(o.label) + '</option>').join("");
}

loadModels();
loadList();
</script>
</body>
</html>
