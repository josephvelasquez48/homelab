[project]
name = "homelab-zimsearch"
version = "0.1.0"
description = "JSON full-text search over local ZIM archives, for LLM retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Direct bindings to the archive's own Xapian index. The alternative,
    # scraping kiwix-serve's RSS, costs an HTTP hop and an HTML parse to get
    # a worse result: 500-character snippets instead of article text.
    "libzim>=3.5",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
