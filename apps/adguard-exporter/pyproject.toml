[project]
name = "adguard-exporter"
version = "0.1.0"
description = "Tiny Prometheus exporter for AdGuard Home - only the metrics kubernetes/monitoring/grafana.yaml actually queries"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]
