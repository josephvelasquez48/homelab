global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-pi
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: homelab-api
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.131:8000"]
