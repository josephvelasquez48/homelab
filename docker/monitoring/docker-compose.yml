services:
  # Prometheus + Grafana migrated to the K3s cluster (see kubernetes/monitoring/).
  # node-exporter stays here - it needs host /proc and /sys, and the
  # in-cluster Prometheus scrapes it directly as an external target.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: homelab_node_exporter
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Prometheus textfile collector. The Mac publishes backup health
      # here over its existing SSH key (backup/publish-backup-metrics.py),
      # so backup state is scrapeable without a listener on the Mac and
      # without the Pi needing credentials for the restic repository.
      - /var/lib/node_exporter/textfile:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:9100
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    restart: unless-stopped
