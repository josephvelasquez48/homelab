services:
  # Front door: LAN clients point at this, unchanged since Milestone 1.
  # Serves *.home from a hosts file and forwards everything else to
  # AdGuard Home instead of a public resolver directly - see README.md.
  coredns:
    image: coredns/coredns:1.14.7
    container_name: coredns
    network_mode: host
    volumes:
      - ./coredns:/etc/coredns:ro
    command: -conf /etc/coredns/Corefile
    restart: unless-stopped
    depends_on:
      - adguardhome

  # Filtering + observability layer, not the LAN-facing server - its DNS
  # listener is loopback-only (127.0.0.1:5335, set during its own setup
  # wizard), reachable only from CoreDNS on the same host. Only its web
  # UI (:3000) is LAN-reachable, for the query log/per-client stats/
  # blocklist management CoreDNS's hosts-file approach didn't have.
  adguardhome:
    image: adguard/adguardhome:v0.107.79
    container_name: adguardhome
    network_mode: host
    volumes:
      - ./adguard/conf:/opt/adguardhome/conf
      - ./adguard/work:/opt/adguardhome/work
    restart: unless-stopped

  # Polls AdGuard's own /control/status + /control/stats API and re-exposes
  # exactly what kubernetes/monitoring/grafana.yaml's dashboard queries as
  # Prometheus metrics on :9618 - AdGuard has no native /metrics endpoint.
  # Own tiny exporter (apps/adguard-exporter), not a third-party image -
  # built natively here since this only ever runs on the Pi (arm64), no
  # multi-arch buildx needed unlike apps/api and apps/dashboard, which run
  # on both cluster nodes. host networking so it can reach AdGuard over
  # 127.0.0.1:3000 the same way CoreDNS reaches AdGuard's DNS listener,
  # and so Prometheus (in the cluster) can reach it via the Pi's real IP,
  # matching how it already reaches node_exporter's node-pi target - see
  # kubernetes/monitoring. ADGUARD_PASSWORD comes from .env (gitignored) -
  # see docker/dns/secrets/write-env.sh.
  adguard-exporter:
    build: ../../apps/adguard-exporter
    container_name: adguard-exporter
    network_mode: host
    environment:
      ADGUARD_URL: http://127.0.0.1:3000
      ADGUARD_USERNAME: admin
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD}
    restart: unless-stopped
    depends_on:
      - adguardhome
    # Already runs as a non-root user (Dockerfile) - this is the rest of
    # the same "it only needs to poll two read-only HTTP endpoints and
    # serve /metrics" argument, enforced instead of just true by
    # convention: no writable filesystem beyond the one thing Python
    # itself expects (tmpfs /tmp - PYTHONDONTWRITEBYTECODE in the
    # Dockerfile means it's otherwise unused), every Linux capability
    # dropped, no privilege-escalation path even if something upstream
    # of it did allow setuid/setgid.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
