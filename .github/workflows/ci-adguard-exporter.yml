name: AdGuard Exporter CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/adguard-exporter/**"
      - "kubernetes/monitoring/adguard-exporter.yaml"
      - ".github/workflows/ci-adguard-exporter.yml"
  pull_request:
    paths:
      - "apps/adguard-exporter/**"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-adguard-exporter

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/adguard-exporter
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # arm64 only, unlike apps/api / apps/dashboard's amd64+arm64 - this
      # is nodeSelector-pinned to joe (the Pi) and always will be, since
      # it needs same-node traffic to reach AdGuard's API without ufw in
      # the way (see kubernetes/monitoring/adguard-exporter.yaml). A
      # multi-arch build would just be unused amd64 bytes.
      - uses: docker/build-push-action@v6
        with:
          context: apps/adguard-exporter
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

  # Same GitOps close-the-loop pattern as ci.yml / ci-dashboard.yml - see
  # docs/argocd.md for why this only needs to write to git, not the
  # cluster directly.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: git-deploy-main
    steps:
      # The deploy key, not GITHUB_TOKEN: it's the bypass on main's
      # ruleset (terraform/github/ruleset.tf), which a personal repo
      # can't grant to GitHub Actions itself. See docs/cicd.md.
      #
      # Main as it is now, not the commit that triggered this run: two
      # merges close together build in parallel, and the second deploy
      # rebased its image line onto the first's and conflicted (the cam's
      # 2026-10-03, then the dashboard's 2026-10-05, #153 and #154).
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          ref: main
          fetch-depth: 0
      # A newer commit for this app on main has its own run, which deploys
      # a newer image; pushing this one after it would roll the app back.
      - id: newer
        run: |
          newer=$(git log --format=%h --invert-grep --grep='\[skip ci\]' "$GITHUB_SHA..HEAD" -- \
            apps/adguard-exporter kubernetes/monitoring/adguard-exporter.yaml .github/workflows/ci-adguard-exporter.yml)
          if [ -n "$newer" ]; then echo "newer commits on main ($newer) - their run deploys"; fi
          echo "skip=$([ -n "$newer" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.newer.outputs.skip == 'false'
        run: |
          sed -i "s#image: ${{ env.IMAGE }}:.*#image: ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }}#" \
            kubernetes/monitoring/adguard-exporter.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/monitoring/adguard-exporter.yaml
          git diff --staged --quiet && echo "no image change" || git commit -m "Deploy adguard-exporter ${{ needs.build-and-push.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push
