name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "kubernetes/backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/api/**"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}

  # Argo CD (roadmap step 12) watches this repo and applies whatever the
  # manifests say - so "deploy" now means "update the manifests and let
  # Argo CD do the rest", not "push changes into the cluster directly".
  # This runs on a normal GitHub-hosted runner: committing to git needs no
  # access to the private K3s API at all, unlike the kubectl-based deploy
  # this replaced (see docs/cicd.md for why that needed a self-hosted
  # runner on the Pi, and docs/argocd.md for why it doesn't anymore).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Shared across both this workflow and ci-dashboard.yml's deploy job -
    # see the comment there for why (both push straight to main with no
    # coordination, so simultaneous deploys race and one's push gets
    # rejected). Serializes execution; the git pull --rebase below is
    # what actually makes a queued run's push succeed against the newer
    # main left behind by whichever ran first.
    concurrency:
      group: git-deploy-main
    steps:
      - uses: actions/checkout@v6
      - run: |
          sed -i "s#image: ${{ env.IMAGE }}:.*#image: ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }}#" \
            kubernetes/backend/api.yaml kubernetes/backend/worker.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/backend/api.yaml kubernetes/backend/worker.yaml
          git diff --staged --quiet && echo "no image change" || git commit -m "Deploy ${{ needs.build-and-push.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push
