name: PR gate

# The one check main's ruleset requires. Every other workflow is
# path-filtered, so most PRs (docs, Ansible, Terraform, manifests) run
# none of them - requiring any of their `test` jobs would leave those PRs
# waiting on a check that never reports. This runs on every PR, waits for
# whatever workflows the PR did trigger, and fails if any of them failed:
# a docs PR passes in seconds, an API PR waits for the API tests.
#
# Re-running a failed workflow doesn't re-run this; re-run the gate too
# once the fix is green (or push a commit, which runs both).
on:
  pull_request:

permissions:
  actions: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for this commit's other workflows
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Workflow runs are created when the event fires, alongside this
          # one, so a short head start is enough for all of them to exist.
          sleep 15
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)]")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$pending" -eq 0 ]; then break; fi
            echo "Waiting on $pending workflow run(s)..."
            sleep 20
          done

          jq -r '.[] | "\(.conclusion)\t\(.name)"' <<<"$runs"
          failed=$(jq '[.[] | select(.conclusion | IN("success", "skipped", "neutral") | not)] | length' <<<"$runs")
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed workflow run(s) did not succeed"
            exit 1
          fi
